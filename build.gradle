plugins {
    id 'java'
}

group = 'me.ghosty0656'
version = '0.1.0'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}

tasks.named('processResources') {
    filesMatching('manifest.json') {
        expand(project.properties)
    }
}